<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No Encontrado</title>
    <style>
        /* Eliminamos márgenes por defecto del navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* El contenedor ocupa el 100% del alto y ancho de la ventana */
        .full-screen-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background-color: #000; /* Fondo de seguridad negro */
        }

        /* La imagen ocupa el 100% de su contenedor */
        img {
            width: 100%;
            height: 100%;
            /* 'cover' asegura que llene todo el espacio sin deformarse */
            object-fit: cover; 
            display: block;
        }

        /* Capa superior para el texto y el botón */
        .overlay-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2); /* Sombra suave para leer el texto */
            color: white;
            text-align: center;
            font-family: sans-serif;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem); /* Tamaño fluido según la pantalla */
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .btn {
            margin-top: 20px;
            padding: 15px 40px;
            background-color: white;
            color: black;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="full-screen-container">
        <img src="cuatro.webp" alt="Error 404">

        <div class="overlay-content">
            <h1>404</h1>
            <p>Página no encontrada</p>
            <a href="/" class="btn">Volver al inicio</a>
        </div>
    </div>

</body>
</html>
