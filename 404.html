<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No Encontrado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000; /* Fondo exterior negro */
            font-family: sans-serif;
            overflow: hidden;
        }

        /* El contenedor manda: ocupa el 70% de la pantalla */
        .contenedor-70 {
            width: 70vw;
            height: 70vh; /* También limitamos la altura para mantener la proporción */
            position: relative;
            overflow: hidden;
            border-radius: 15px; /* Bordes estéticos */
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }

        /* La imagen llena el contenedor al 100% */
        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Llena el espacio sin deformarse */
            display: block;
        }

        .texto-superpuesto {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3); /* Capa oscura para leer el texto */
            color: white;
            text-align: center;
        }

        .btn {
            margin-top: 15px;
            padding: 10px 25px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="contenedor-70">
        <img src="cuatro.webp" alt="Error 404">

        <div class="texto-superpuesto">
            <h1>404</h1>
            <p>Página no encontrada</p>
            <a href="/" class="btn">Inicio</a>
        </div>
    </div>

</body>
</html>
