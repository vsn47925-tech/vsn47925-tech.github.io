<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No Encontrado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Elige el color de fondo que mejor combine con tu video */
            background-color: #1a1a1a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            /* Aquí controlamos que ocupe el 70% (reducción del 30%) */
            width: 70vw; 
            max-width: 1000px;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 20px; /* Bordes redondeados para que se vea elegante */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="cuatro04_final.webp" alt="Error 404">

        <h1>¡Ups! Página no encontrada</h1>
        <p>Parece que te has desviado del camino.</p>
        
        <a href="/" class="btn">Volver al Inicio</a>
    </div>

</body>
</html>
