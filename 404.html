<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No Encontrado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #121212; /* Fondo oscuro profundo */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        .error-wrapper {
            text-align: center;
            /* Aquí fijamos el ancho al 70% de la pantalla */
            width: 70vw; 
            max-width: 900px; /* Evita que en pantallas gigantes se vea desproporcionado */
        }

        img {
            width: 100%; /* Ocupa el 100% de su contenedor (que es el 70% de la pantalla) */
            height: auto;
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 35px;
            background-color: #ffffff;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #e0e0e0;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="error-wrapper">
        <img src="cuatro.webp" alt="Error 404">

        <h1>404</h1>
        <p>Vaya, parece que has tomado un giro equivocado.</p>
        
        <a href="/" class="btn">Regresar al inicio</a>
    </div>

</body>
</html>
