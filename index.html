<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villaitue AutoServicio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: #0a0f1a;
            color: #0f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(10, 15, 26, 0.9), rgba(10, 15, 26, 0.9)),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 1px,
                    rgba(0, 30, 0, 0.1) 1px,
                    rgba(0, 30, 0, 0.1) 2px
                );
            z-index: -1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
            width: 100%;
        }

        .logo {
            font-size: 2.8em;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 10px;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
        }

        .subtitle {
            color: #5a5;
            font-size: 1.1em;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        .status {
            background: rgba(0, 20, 0, 0.8);
            border: 1px solid #0f0;
            padding: 12px 25px;
            border-radius: 4px;
            margin: 20px 0;
            min-height: 28px;
            font-size: 1.2em;
            text-align: center;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
            width: 100%;
            max-width: 600px;
        }

        .mic-btn {
            background: #000;
            border: 3px solid #0f0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            color: #0f0;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            margin: 30px 0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.8);
        }

        .mic-btn:active {
            transform: scale(0.95);
        }

        .mic-btn.recording {
            border-color: #f00;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
            animation: pulse 1s infinite;
        }

        .mic-btn.recording::after {
            content: '●';
            position: absolute;
            font-size: 1.8em;
            color: #f00;
            animation: blink 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 25px rgba(255, 0, 0, 0.8); }
            50% { box-shadow: 0 0 35px rgba(255, 0, 0, 1); }
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .robot {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 90px;
            height: 120px;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 8px #0f0);
        }

        .robot:hover {
            transform: scale(1.1) rotate(3deg);
        }

        .robot .antenna-light {
            transition: fill 0.3s, r 0.3s;
        }

        .robot.speaking .antenna-light {
            fill: #0f0 !important;
            animation: antenna-pulse 0.3s infinite;
        }

        .robot.listening .antenna-light {
            fill: #0af !important;
            animation: antenna-pulse 1.5s infinite;
        }

        .robot.idle .antenna-light {
            fill: #888 !important;
            animation: none;
        }

        .robot .eye {
            transition: fill 0.2s;
        }

        .robot.speaking .eye {
            animation: eye-blink-fast 0.6s infinite;
        }

        .robot.listening .eye {
            animation: eye-blink-slow 4s infinite;
        }

        .robot.idle .eye {
            fill: #444 !important;
        }

        .robot .mouth {
            transition: fill 0.3s;
        }

        .robot.speaking .mouth {
            animation: mouth-pulse 0.4s infinite;
        }

        @keyframes antenna-pulse {
            50% { r: 7; }
        }

        @keyframes eye-blink-fast {
            0%, 45%, 55%, 100% { fill: #0f0; }
            50% { fill: #000; }
        }

        @keyframes eye-blink-slow {
            0%, 48%, 52%, 100% { fill: #0f0; }
            50% { fill: #000; }
        }

        @keyframes mouth-pulse {
            0%, 100% { fill: #0f0; }
            50% { fill: #0a0; }
        }

        .instructions {
            color: #666;
            font-size: 0.9em;
            margin-top: 25px;
            text-align: center;
            max-width: 400px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .logo { font-size: 2.2em; }
            .mic-btn { width: 80px; height: 80px; font-size: 2em; }
            .robot { width: 70px; height: 95px; bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">VILLAITUE</div>
        <div class="subtitle">AUTO-SERVICIO • 1984</div>
    </div>

    <div class="status" id="status">Presiona el micrófono para comenzar</div>

    <button class="mic-btn" id="micBtn">
        <div>🎤</div>
    </button>

    <div class="instructions">
        El sistema escuchará durante 10 segundos.<br>
        Responde a las preguntas del asistente.
    </div>

    <!-- Robot ochentero minimalista -->
    <div class="robot idle" id="robot">
        <svg viewBox="0 0 100 140" width="100%" height="100%">
            <!-- Base -->
            <ellipse cx="50" cy="130" rx="35" ry="6" fill="#222"/>
            <!-- Cuerpo -->
            <rect x="25" y="60" width="50" height="65" rx="6" fill="#111" stroke="#555" stroke-width="2"/>
            <!-- Cuello -->
            <rect x="38" y="45" width="24" height="15" rx="4" fill="#222" stroke="#555" stroke-width="2"/>
            <!-- Cabeza -->
            <rect x="28" y="15" width="44" height="30" rx="6" fill="#111" stroke="#fff" stroke-width="2"/>
            <!-- Antena -->
            <line x1="50" y1="5" x2="50" y2="15" stroke="#fff" stroke-width="2"/>
            <circle class="antenna-light" cx="50" cy="5" r="5" fill="#888"/>
            <!-- Ojos -->
            <rect class="eye" x="35" y="25" width="12" height="12" rx="2" fill="#0f0" stroke="#fff" stroke-width="1.5"/>
            <rect class="eye" x="53" y="25" width="12" height="12" rx="2" fill="#0f0" stroke="#fff" stroke-width="1.5"/>
            <!-- Boca LED -->
            <rect class="mouth" x="40" y="42" width="20" height="4" rx="2" fill="#444"/>
            <!-- Panel pecho -->
            <rect x="38" y="85" width="24" height="12" rx="3" fill="#000" stroke="#0f0" stroke-width="1.5"/>
            <circle cx="44" cy="91" r="2" fill="#f00"/>
            <circle cx="56" cy="91" r="2" fill="#0f0"/>
        </svg>
    </div>

    <script>
        // DOM Elements
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('status');
        const robotEl = document.getElementById('robot');
        
        // Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isListening = false;
        let silenceTimeout;
        
        // Inicializar SpeechRecognition
        function initRecognition() {
            if (!SpeechRecognition) {
                statusEl.textContent = "⚠️ SpeechRecognition no soportado";
                micBtn.disabled = true;
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'es-CL';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            
            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('recording');
                robotEl.className = 'robot listening';
                statusEl.textContent = "Escuchando...";
                resetSilenceTimeout();
            };
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                statusEl.textContent = `Tú: "${transcript}"`;
                console.log('Texto reconocido:', transcript);
                
                // Aquí integrarías con tu n8n/webhook
                // Ej: sendToN8n(transcript);
                
                // Simular respuesta del agente (reemplazar con tu lógica real)
                setTimeout(() => {
                    simulateAgentResponse();
                }, 800);
            };
            
            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('recording');
                
                if (!silenceTimeout) {
                    // Silencio detectado (no hubo resultado)
                    statusEl.textContent = "No se detectó audio...";
                    robotEl.className = 'robot idle';
                    
                    // Reiniciar en 5 segundos (como pides en tus requisitos)
                    setTimeout(() => {
                        statusEl.textContent = "Presiona el micrófono para comenzar";
                        window.location.reload();
                    }, 5000);
                }
            };
            
            recognition.onerror = (event) => {
                console.error('Error de reconocimiento:', event.error);
                statusEl.textContent = `Error: ${event.error}`;
                micBtn.classList.remove('recording');
                isListening = false;
                robotEl.className = 'robot idle';
            };
        }
        
        // Reiniciar timeout de silencio
        function resetSilenceTimeout() {
            if (silenceTimeout) clearTimeout(silenceTimeout);
            silenceTimeout = setTimeout(() => {
                if (isListening) {
                    recognition.stop();
                    silenceTimeout = null;
                }
            }, 10000); // 10 segundos máximo de escucha
        }
        
        // Simular respuesta del agente (reemplazar con tu integración real)
        function simulateAgentResponse() {
            robotEl.className = 'robot speaking';
            statusEl.textContent = "🤖: Procesando tu solicitud...";
            
            // Simular tiempo de respuesta (reemplazar con llamada a n8n/Piper)
            setTimeout(() => {
                statusEl.textContent = "🤖: ¡Hola! ¿En qué puedo ayudarte hoy?";
                
                // Después de la respuesta, preparar para escuchar de nuevo
                setTimeout(() => {
                    if (!isListening) {
                        startListening();
                    }
                }, 1500);
            }, 1200);
        }
        
        // Iniciar escucha
        function startListening() {
            try {
                recognition.start();
            } catch (e) {
                console.log('Reiniciando recognition...');
                initRecognition();
                recognition.start();
            }
        }
        
        // Eventos
        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
                silenceTimeout = null;
            } else {
                startListening();
            }
        });
        
        // Inicializar al cargar
        document.addEventListener('DOMContentLoaded', () => {
            initRecognition();
            
            // Permitir audio al hacer clic (política de navegadores)
            document.body.addEventListener('click', () => {
                if (!audioContext) {
                    initAudioContext();
                }
            }, { once: true });
        });
        
        // Audio Context (para futura integración con Piper TTS)
        let audioContext;
        function initAudioContext() {
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                console.log('AudioContext inicializado');
            } catch (e) {
                console.warn('AudioContext no disponible:', e);
            }
        }
        
        // Para integración futura: reproducir audio de Piper TTS
        function playAudioFromBase64(base64Audio) {
            if (!audioContext) initAudioContext();
            
            robotEl.className = 'robot speaking';
            
            // Decodificar y reproducir (implementar según tu API Express)
            fetch(`data:audio/wav;base64,${base64Audio}`)
                .then(response => response.arrayBuffer())
                .then(arrayBuffer => audioContext.decodeAudioData(arrayBuffer))
                .then(audioBuffer => {
                    const source = audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(audioContext.destination);
                    source.start();
                    
                    source.onended = () => {
                        robotEl.className = 'robot listening';
                        // Aquí activarías el micrófono automáticamente
                        // startListening();
                    };
                });
        }
    </script>
</body>
</html>
