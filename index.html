<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabañas Villaitue Villarrica - Autoservicio Accesible</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS para OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <style>
        /* ... (todos los estilos permanecen exactamente igual) ... */
    </style>
</head>
<body class="min-h-screen bg-gray-100">
    <!-- ... (todo el HTML permanece exactamente igual) ... -->

    <script>
        // Variables globales
        let recognition = null;
        let isListening = false;
        let welcomeInterval = null;
        let welcomeSlideIndex = 0;
        let currentCarouselIndex = 0;
        let carouselInterval = null;
        let carouselSlides = [];
        let carouselDots = [];
        let map = null;
        let marker = null;
        let processingMessages = [];
        let currentMessageIndex = 0;
        let messageInterval = null;
        // ❌ Eliminamos autoResetTimeout porque no lo necesitamos
        
        // ✅ COORDENADAS CORRECTAS Y PRECISAS DE GOOGLE MAPS
        const VILLAITUE_COORDS = [-39.2852346, -72.2227348];
        const MAP_ZOOM = 17;
        const AUTO_RESET_TIMEOUT_MS = 10000; // 10 segundos
        
        // ... (funciones de utilidad como announceToScreenReader, etc., permanecen igual) ...

        // Inicializar reconocimiento de voz - ¡MODIFICADO!
        function initVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                announceToScreenReader("Su navegador no soporta reconocimiento de voz. Por favor, use Chrome.");
                return null;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'es-CL';
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                isListening = true;
                updateVoiceButton(true);
                announceToScreenReader("Escuchando. Puede hablar ahora.");
            };
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                announceToScreenReader(`Ha dicho: ${transcript}. Procesando...`);
                sendToN8N(transcript);
            };
            
            recognition.onerror = (event) => {
                isListening = false;
                updateVoiceButton(false);
                const errorMsg = "Error en el reconocimiento de voz";
                showErrorState(errorMsg);
                announceToScreenReader(errorMsg);
                
                // Si hay un error de "no-speech", programar la recarga
                if (event.error === 'no-speech' || event.error === 'audio-capture') {
                    schedulePageReload();
                }
            };
            
            recognition.onend = () => {
                isListening = false;
                updateVoiceButton(false);
                // Cuando el micrófono se cierra SIN resultado, programar la recarga
                schedulePageReload();
            };
            
            return recognition;
        }
        
        // ... (funciones de envío y procesamiento de datos permanecen igual) ...

        // Nueva función: Programar la recarga de la página
        function schedulePageReload() {
            console.log("🔄 Programando recarga de la página en 10 segundos.");
            // Usamos setTimeout directamente, sin guardar la referencia
            setTimeout(() => {
                console.log("✅ ¡Recargando la página ahora!");
                location.reload();
            }, AUTO_RESET_TIMEOUT_MS);
        }

        // Nueva función: Leer texto y luego activar escucha automática
        function leerTextoYEscucharAutomaticamente(texto) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-CL';
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                
                // Cuando termine de hablar, activar el micrófono
                utterance.onend = () => {
                    announceToScreenReader("Escuchando para su próxima consulta...");
                    if (recognition) {
                        recognition.start();
                    }
                };
                
                speechSynthesis.speak(utterance);
            } else {
                // Si no hay síntesis de voz, activar inmediatamente
                if (recognition) {
                    recognition.start();
                }
            }
        }
        
        // ... (el resto de las funciones de renderizado permanecen igual) ...
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            initWelcomeCarousel();
            initProcessingMessages();
            recognition = initVoiceRecognition();
            
            // Botón de inicio
            document.getElementById('startVoiceBtn').addEventListener('click', () => {
                if (recognition) {
                    // Al iniciar manualmente, NO programamos recarga
                    document.getElementById('welcomeScreen').classList.add('hidden');
                    document.getElementById('responseWrapper').classList.remove('hidden');
                    recognition.start();
                }
            });
            
            // ... (otros listeners permanecen igual) ...
        });
    </script>
</body>
</html>
